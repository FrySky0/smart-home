spring:
  application:
    name: "smart-home"
    version: "0.2"
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  cookie-name: auth-token

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: SmartHomeBot
    chat-id: ${TELEGRAM_CHAT_ID}

logging:
  level:
    com.smarthome.smart_home: DEBUG
    org.springframework: INFO
  file:
    name: logs/smart-home-app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} - [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      file-name-pattern: logs/smart-home-app.%d{yyyy-MM-dd}.%i.log

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 9001
